<?xml version="1.0" encoding="UTF-8"?>
<!-- Flow99 BIMI logo — SVG Tiny 1.2, square 512x512, no scripts, no external references, no animation. -->
<!-- New official Flow99 lockup (2026-11-22): black "Flow" + interlocking tricolor "99" ribbons -->
<!-- (saffron / white-silver / green). BIMI forbids raster images, so the glass-ribbon render is -->
<!-- reproduced here as flat vector shapes: three overlapping "9" loops with tails. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" viewBox="0 0 512 512" width="512" height="512">
  <title>Flow99</title>
  <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
  <text x="30" y="295" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="bold" fill="#161616">Flow</text>
  <!-- back 9: silver-white ribbon -->
  <g fill="none" stroke="#c7ccd4" stroke-width="24" stroke-linecap="round">
    <circle cx="318" cy="232" r="46"/>
    <path d="M 286 264 Q 266 310 240 340"/>
  </g>
  <!-- middle 9: saffron ribbon -->
  <g fill="none" stroke="#f28c28" stroke-width="24" stroke-linecap="round">
    <circle cx="368" cy="232" r="46"/>
    <path d="M 336 264 Q 316 310 290 340"/>
  </g>
  <!-- front 9: green ribbon -->
  <g fill="none" stroke="#1fa055" stroke-width="24" stroke-linecap="round">
    <circle cx="418" cy="232" r="46"/>
    <path d="M 386 264 Q 366 310 340 340"/>
  </g>
</svg>
