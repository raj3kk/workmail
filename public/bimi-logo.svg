<?xml version="1.0" encoding="UTF-8"?>
<!-- Flow99 BIMI logo — SVG Tiny 1.2, square 512x512, no scripts, no external references, no animation. -->
<!-- New official Flow99 lockup (2026-11-22): black "Flow" + tricolor "99". BIMI accepts ONLY -->
<!-- vector SVG (no photo/raster allowed), so the glossy 3D ribbons are rendered with the real -->
<!-- letterforms: bold "9" glyphs in saffron + green. v5: text-based 9s (v1–v4 drew the 9s as -->
<!-- stroked rings — the owner rightly called that bekar; real 9 glyphs read instantly). -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" viewBox="0 0 512 512" width="512" height="512">
  <title>Flow99</title>
  <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
  <!-- silver-white ribbon: accent arc over the 9s -->
  <path d="M 285 215 Q 360 175 445 215" fill="none" stroke="#9aa1ab" stroke-width="12" stroke-linecap="round"/>
  <text x="69" y="330" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="bold" fill="#161616">Flow</text>
  <text x="289" y="330" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="bold" fill="#f28c28">9</text>
  <text x="369" y="330" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="bold" fill="#1fa055">9</text>
</svg>
