name = "workmail-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
# BEFORE DEPLOY: create the D1 database (`wrangler d1 create workmail-db`)
# and replace the placeholder database_id below with the real id.
# Until then `wrangler deploy` binds no database and env.DB is undefined.
[[d1_databases]]
binding = "DB"
database_name = "workmail-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
# Worker secrets (set with `wrangler secret put`, never committed):
# APP_BEARER_TOKEN, INBOUND_WEBHOOK_TOKEN, provider keys (BREVO_API_KEY,
# MAILJET_API_KEY/MAILJET_SECRET_KEY, RESEND_API_KEY, SENDPULSE_ID/
# SENDPULSE_SECRET, MAILTRAP_API_TOKEN, SMTP2GO_API_KEY, GAS_WEBHOOK_URL/
# GAS_SECRET). See .env.example in this directory.
# Optional vars: DEFAULT_MAILBOX (mailbox address used when no ?mailbox= is given).
#
# NOTE: no KV binding here. Attachments are stored in Cloudflare KV by the
# Vercel app (via its KV REST calls), not by this worker. This worker only
# touches D1. The canonical schema is db/schema.sql at the repo root.
